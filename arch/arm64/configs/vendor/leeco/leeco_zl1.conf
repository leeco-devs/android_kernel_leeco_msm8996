# LeEco zl1, merged after leeco_msm8996-common.conf.
CONFIG_PRODUCT_LE_ZL1=y
CONFIG_SND_SOC_MAX98927=y
CONFIG_SND_SOC_WCD_MBHC_ZL1=y

# FocalTech touch panels: all five zl1 DTBs carry a live focaltech,fts node.
CONFIG_TOUCHSCREEN_FTS_LETV=y

# zl1 uses the TUSB320 CC logic and the goodix fingerprint reader, and no
# MHL, no atmega48a keys and no QBT1000.
CONFIG_USB_CCLOGIC_TUSB320=y
CONFIG_INPUT_GP5XX8=y
# NQx NFC controller, live on every zl1 board.
CONFIG_NFC_NQ=y
CONFIG_QPNP_MHL=n
CONFIG_TOUCHKEY_ATMEGA48A_LETV=n
CONFIG_MSM_QBT1000=n
# QPNP_TYPEC stays off: unported here, as on x2.
