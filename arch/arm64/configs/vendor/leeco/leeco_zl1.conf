# LeEco zl1, merged after leeco_msm8996-common.conf.
CONFIG_PRODUCT_LE_ZL1=y
CONFIG_SND_SOC_MAX98927=y
CONFIG_SND_SOC_WCD_MBHC_ZL1=y

# zl1 uses the TUSB320 CC logic, and no MHL, no atmega48a keys and no
# QBT1000. Its goodix reader (CONFIG_INPUT_GP5XX8) is left off: gf_spi.c still
# uses the 3.18 spi_driver suspend/resume callbacks and does not build here.
CONFIG_USB_CCLOGIC_TUSB320=y
CONFIG_QPNP_MHL=n
CONFIG_TOUCHKEY_ATMEGA48A_LETV=n
CONFIG_MSM_QBT1000=n
# QPNP_TYPEC stays off: unported here, as on x2.
