# LeEco msm8996 common options, merged on top of msm-perf_defconfig.
CONFIG_VENDOR_LEECO=y

# Shared Type-C CC-logic state and the controllers both boards carry.
CONFIG_USB_CCLOGIC=y
CONFIG_USB_CCLOGIC_PI5USB=y
CONFIG_USB_CCLOGIC_TUSB302L=y

# LM3697 backlight chip driven from the mdss BL_PWM path.
CONFIG_BACKLIGHT_LM3697=y

# pm8994 VADC provider for the charger's qcom,usbtemp-vadc channel.
CONFIG_SENSORS_QPNP_ADC_VOLTAGE=y

# pm8994 die temperature alarm behind every board's qcom,qpnp-temp-alarm
# node. The 3.18 configs build it for both boards.
CONFIG_THERMAL_QPNP=y

# SPDM bandwidth voting, the devfreq_spdm_cpu and devfreq_spdm_gov nodes in
# msm8996-bus.dtsi that every board inherits. The governor is selected by
# SPDM but the 3.18 configs name it too.
CONFIG_DEVFREQ_SPDM=y
CONFIG_DEVFREQ_GOV_SPDM_HYP=y

# LM3643/LM3648 flash LED the LeEco camera nodes drive over CCI.
CONFIG_MSM_I2C_FLASH=y

# MAXQ616 infrared receiver, live on both board families.
CONFIG_IR_MAXQ616=y

# DRV2604L haptics, wired on i2c_9 of the x2 boards.
CONFIG_INPUT_DRV2604L_HAPTICS=y

# ramoops node every LeEco board reserves, and the backends that read it.
# The 3.18 configs also keep the console log and the userspace pmsg channel.
CONFIG_PSTORE=y
CONFIG_PSTORE_CONSOLE=y
CONFIG_PSTORE_PMSG=y
CONFIG_PSTORE_RAM=y

# SII6400 MHL/WiHD output, live on the zl1 and max_plus boards. QPNP_MHL
# below comes from the board fragments; the driver also needs the LeTV dwc3
# hooks, which are built here. It loads sii6400_mhl.fw, sii6400_wihd.fw and
# sii6400_wihd_mhl.fw at runtime and none of those are in this tree.
CONFIG_FB_MSM_MDSS_HDMI_MHL_SII6400=y

# Board EEPROM and the Letv input stack.
CONFIG_MSM_EEPROM=y
CONFIG_EEPROM_AT24=y
CONFIG_LETVS_CLASS=y
CONFIG_TOUCHSCREEN_SYNAPTICS_DSX_LETV=y
CONFIG_TOUCHSCREEN_SYNAPTICS_DSX_I2C_LETV=y
CONFIG_TOUCHSCREEN_SYNAPTICS_DSX_CORE_LETV=y
CONFIG_TOUCHSCREEN_SYNAPTICS_DSX_FW_UPDATE_LETV=y
CONFIG_TOUCHSCREEN_SYNAPTICS_DSX_TEST_REPORTING_LETV=y
CONFIG_TOUCHSCREEN_HIDEEP_TP_LETV=y
CONFIG_TOUCHSCREEN_ATMEL_MXT_LETV=y
