# LeEco x2, merged after leeco_msm8996-common.conf.
CONFIG_PRODUCT_LE_X2=y
# PRODUCT_LE_ZL1 selects these for zl1 only.
# CONFIG_SND_SOC_MAX98927 is not set
# CONFIG_SND_SOC_WCD_MBHC_ZL1 is not set

# NXP TFA98xx smart PA, live on the x2 evt/dvt boards and max_plus.
CONFIG_SND_SOC_TFA98XX=y

# ES9018 DAC on the max_plus DTBs, which also switches on the Secondary MI2S
# HiFi back ends in the msm8996 machine driver. 3.18 builds it for both of
# its boards; the zl1 fragment leaves it off here.
CONFIG_SND_SOC_ES9018=y

# x2 carries the Cypress PD controller, MHL and the atmega48a keys.
CONFIG_USB_CYCCG=y
CONFIG_QPNP_MHL=y
CONFIG_TOUCHKEY_ATMEGA48A_LETV=y
CONFIG_MSM_QBT1000=y

# QPNP_TYPEC stays off: the controller driver is not in this tree yet.
CONFIG_USB_CCLOGIC_TUSB320=n

# NQx NFC controller, live on the x2 evt and max_plus boards.
CONFIG_NFC_NQ=y
